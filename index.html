const table = document.querySelector('#table');
const status = document.querySelector('#status');
const results = document.querySelector('#results');

async function loadRoster() {
  const fragment = location.hash.slice(1);
  if (!/^[a-f0-9]{32}$/.test(fragment)) {
    status.textContent = '请扫描签到处的座位查询二维码。';
    return;
  }
  try {
    const keyBytes = Uint8Array.from(fragment.match(/../g), pair => parseInt(pair, 16));
    const bytes = Uint8Array.from(atob(sealed), char => char.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes.slice(0,12)}, key, bytes.slice(12));
    const roster = Object.entries(JSON.parse(new TextDecoder().decode(plaintext)));
    for (const [number] of roster) {
      table.add(new Option(number + '号桌', number));
    }
    function render() {
      const term = query.value.trim().normalize('NFKC').toLowerCase();
      let count = 0;
      results.replaceChildren();
      for (const [number, names] of roster) {
        if (table.value && number !== table.value) continue;
        const matches = names.filter(name => name.normalize('NFKC').toLowerCase().includes(term));
        if (!matches.length) continue;
        count += matches.length;
        const card = document.createElement('details');
        card.className = 'card';
        card.open = Boolean(term || table.value);
        const title = document.createElement('summary');
        title.textContent = number + '号桌';
        const list = document.createElement('ul');
        for (const name of matches) {
          const item = document.createElement('li');
          item.textContent = name;
          list.append(item);
        }
        card.append(title, list);
        results.append(card);
      }
      status.textContent = term
        ? (count ? '找到 ' + count + ' 条记录' : '未找到匹配姓名，可以试试只输入姓氏。')
        : (table.value ? '正在查看 ' + table.value + '号桌' : '点击桌号展开名单');
    }
    document.querySelector('#filters').removeAttribute('hidden');
    document.querySelector('#help').removeAttribute('hidden');
    query.addEventListener('input', () => { if (query.value.trim()) table.value = ''; render(); });
    table.addEventListener('change', () => { query.value = ''; render(); });
    render();
  } catch {
    status.textContent = '座位表加载失败，请重新扫码或咨询签到处。';
  }
}
loadRoster();
