<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>婚宴座位查询 · 连通性测试</title><style>body{margin:0;background:#fff8ed;color:#432630;font:18px system-ui}main{box-sizing:border-box;max-width:480px;margin:auto;padding:48px 24px}h1{color:#742b3b}label,input{display:block}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #a98676;border-radius:8px;font:inherit}output{display:block;padding:12px 0}</style><main><h1>婚宴座位查询</h1><p>GitHub Pages 连通性测试</p><label for="name">输入测试姓名</label><input type="search" id="name" placeholder="例如：测试甲"><output id="result" aria-live="polite">请输入「测试甲」或「测试乙」</output></main><script>const seats={'测试甲':'1号桌','测试乙':'2号桌'};const field=document.querySelector('#name');const result=document.querySelector('#result');field.addEventListener('input',()=>{const name=field.value.trim();result.textContent=name?(Object.hasOwn(seats,name)?name+' · '+seats[name]:'未找到测试姓名'):'请输入「测试甲」或「测试乙」'});</script></html>
